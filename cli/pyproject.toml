[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "crashanalysis-cli"
version = "0.1.0"
description = "Deterministic vmcore evidence collection and classification CLI"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["click>=8.1,<9"]

[project.scripts]
cra = "crashanalysis_cli.main:cli"

[tool.hatch.build.targets.wheel]
packages = ["src/crashanalysis_cli"]

[tool.hatch.build]
include = ["src/crashanalysis_cli/**/*.py", "src/crashanalysis_cli/skills/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
